spring:
  application:
    name: zhitu-ai-travel
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/zhitu_travel?useUnicode=true&characterEncoding=utf8
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-aliyun-api-key}
      chat:
        options:
          model: qwen-plus
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma3:1b
    mcp:
      client:
        sse:
          connections:
            server1:
              url: http://localhost:8127
        stdio:
          servers-configuration: classpath:mcp-servers.json
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456789
      database: 14
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi config
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zhitu.travel.controller
# knife4j config
knife4j:
  enable: true
  setting:
    language: zh_cn
# searchAPI
search-api:
  # 需要替换为你自己的 key（建议在 application-local.yml 中配置）
  api-key: ${SEARCH_API_KEY:your-aliyun-api-key}
# 修改日志级别，查看 Spring AI 更多调用细节
logging:
  level:
    org.springframework.ai: DEBUG